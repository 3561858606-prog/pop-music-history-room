<!doctype html>
<html lang="zh-CN" data-side="lacquer">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0D0C">
<title>大众音乐史复习室 · 母盘</title>
<script type="module" async data-bgm-start src="js/bgm-start.js"></script>
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- 课件视频目录：相对地址按站点根目录解析；视频放在别的站点时填完整网址。 -->
<meta name="course-video-base" content="course-videos/">
<meta name="apple-mobile-web-app-title" content="音乐史复习室">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="../../v3/assets/fonts/fonts.css">
<link rel="stylesheet" href="css/proto.css">
<!-- 第一屏要用的模块一起开始下载，不用一层层等 import 链（手机网络上省一两秒）。
     新加/改名第一屏模块时同步这里；说明卡、更新说明、逐曲长读、翻译表是后载的，不放这里。 -->
<link rel="modulepreload" href="js/app.js">
<link rel="modulepreload" href="js/model.js">
<link rel="modulepreload" href="js/audio-lite.js">
<link rel="modulepreload" href="js/media-tiers.js">
<link rel="modulepreload" href="js/net.js">
<link rel="modulepreload" href="js/train.js">
<link rel="modulepreload" href="js/explore.js">
<link rel="modulepreload" href="js/gl.js">
<link rel="modulepreload" href="js/sleeve-layout.js">
<link rel="modulepreload" href="js/history.js">
<link rel="modulepreload" href="js/reading.js">
<link rel="modulepreload" href="js/video.js">
<link rel="modulepreload" href="js/i18n.js">
<link rel="modulepreload" href="js/store.js">
<link rel="modulepreload" href="js/names.js">
<link rel="modulepreload" href="js/cover-overrides.js">
<link rel="modulepreload" href="js/audio.js">
<link rel="modulepreload" href="js/flat.js">
<link rel="modulepreload" href="js/waveform.js">
<link rel="modulepreload" href="js/word-peek.js">
<link rel="modulepreload" href="../../v3/catalog.js">
<link rel="modulepreload" href="../../v3/covers.js">
<link rel="modulepreload" href="../../v3/core.js">
<link rel="modulepreload" href="../../v3/memory.js">
<link rel="modulepreload" href="../../v3/track-model.js">
<link rel="modulepreload" href="../../v3/written.js">
</head>
<body>
<a class="skip" href="#main" data-i18n>跳到主要内容</a>

<header class="top" id="top">
  <a class="brand" href="#disc" data-i18n>大众音乐史复习室</a>
  <nav class="tabs" aria-label="页面" data-i18n-attr="aria-label">
    <a href="#disc" data-tab="disc" data-i18n>唱片</a>
    <a href="#catalog" data-tab="catalog" data-i18n>目录</a>
    <a href="#result" data-tab="result" data-i18n>结果</a>
    <a href="#history" data-tab="history" data-i18n>历史</a>
  </nav>
  <button class="lang-btn" id="langBtn" type="button" aria-haspopup="true" aria-expanded="false"></button>
  <button class="help-btn" id="helpBtn" type="button" aria-label="帮助、更新与反馈" title="帮助、更新与反馈" data-i18n-attr="aria-label,title">?</button>
</header>

<main id="main">
  <!-- 唱片：漆面 -->
  <section class="room room-disc" id="roomDisc" data-room="disc" hidden>
    <div class="stage" id="stage">
      <canvas id="cosmos" aria-hidden="true"></canvas>
      <canvas id="gl" tabindex="0" role="application" aria-describedby="discHelp"
        aria-label="母盘：外圈 1854 年，内圈 1968 年。方向键移动，回车进入，空格落针。" data-i18n-attr="aria-label"></canvas>
      <div class="hud" id="hud" aria-hidden="true"></div>
      <p class="stage-hint" id="discHelp"></p>
      <section class="bgm-chip" id="bgmChip" aria-label="背景音乐" data-i18n-attr="aria-label" hidden>
        <span class="bgm-eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="bgm-text">
          <span class="bgm-k"><span data-i18n>背景音乐</span> · <span class="bgm-state"></span></span>
          <b class="bgm-title"></b>
          <small class="bgm-meta"></small>
        </span>
        <button class="bgm-btn" id="bgmToggle" type="button" aria-pressed="true"><svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="M3 8h3l4-3.5v11L6 12H3z" fill="currentColor"/><path class="bgm-wave" d="M13 7.2a4 4 0 0 1 0 5.6M15.2 5a7 7 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path class="bgm-x" d="M13.2 7.6l4.4 4.8M17.6 7.6l-4.4 4.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span></span></button>
      </section>
      <div class="legend">
        <span class="lg-key" aria-hidden="true"><i class="lg-cut"></i><span data-i18n>刻过：记住了</span></span>
        <span class="lg-key" aria-hidden="true"><i class="lg-blank"></i><span data-i18n>漆面：还没记住</span></span>
        <span class="lg-src" id="legendSrc" aria-hidden="true"></span>
        <button class="lg-cosmos" id="cosmosToggle" type="button" hidden></button>
        <button class="lg-cosmos lg-fx" id="fxOpen" type="button" data-i18n>星空 · 效果器</button>
        <button class="lg-down" id="toPanel" type="button"><span data-i18n>曲目表</span><svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      </div>
    </div>
    <aside class="panel" id="panel" aria-label="曲目表" data-i18n-attr="aria-label"></aside>
    <div class="sr-only" aria-live="polite" id="live"></div>
    <button class="intro-skip" id="introSkip" data-i18n hidden>跳过</button>
  </section>

  <!-- 目录：高效的那一层 -->
  <section class="room room-catalog" id="roomCatalog" data-room="catalog" hidden>
    <div class="cat-head">
      <h1 data-i18n>目录</h1>
      <label class="cat-search"><span class="sr-only" data-i18n>搜索</span><input id="catSearch" type="search" placeholder="搜索歌名、音乐家、年份、风格" data-i18n-attr="placeholder" autocomplete="off"></label>
      <div class="cat-filters" id="catFilters" role="group" aria-label="筛选" data-i18n-attr="aria-label"></div>
    </div>
    <div class="cat-body" id="catBody"></div>
  </section>

  <!-- 听辨：标签纸面 -->
  <section class="room room-train" id="roomTrain" data-room="train" hidden></section>

  <!-- 结果：标签纸面 -->
  <section class="room room-result" id="roomResult" data-room="result" hidden></section>
<section class="room room-result" id="roomHistory" data-room="history" hidden></section>
</main>
<div class="app-notice" id="appNotice" role="status" hidden></div>
<div class="veil" id="veil" aria-hidden="true"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
